# @package _group_

common:
  fp16: false
  log_interval: 2
  wandb_project: SLTopicDetection
  reset_logging: true
  suppress_crashes: false
  profile: false
  seed: 1
  tpu: false
  cpu: true
  log_format: null
  tensorboard_logdir: ./tensorboard_log

common_eval:
  model_overrides: '{}'
  path: ''

distributed_training:
  tpu: false
  distributed_world_size: 1
  distributed_init_method: null
  pipeline_model_parallel: false
  distributed_port: 0
  distributed_no_spawn: true
  distributed_rank: 0

is_ax: false

hooks:
  embedding: true
  out_file_embedding: ''
  attention: false
  out_file_attention: ''
  logits: true
  out_file: ''

task:
  _name: SL_topic_detection
  feats_type: dynhamr
  body_parts: LEFT_HAND_LANDMARKS,RIGHT_HAND_LANDMARKS
  feat_dims: "0,1,2"
  data: ''
  dict_path: ''
  normalization: layer_norm
  to_camera_coordinates: true
  dynhamr_temporal_interpolation: true
  dynhamr_source_fps: 25.0
  dynhamr_target_fps: 30.0
  dynhamr_fill_mode: neighbor_average
  dynhamr_long_gap_linear_threshold: 8
  data_augmentation: false
  min_source_positions: 150
  max_source_positions: 250000
  max_target_positions: 1
  dataset: ''

dataset:
  num_workers: 0
  max_tokens: 20000
  batch_size: 16
  skip_invalid_size_inputs_valid_test: true
  train_subset: train
  valid_subset: val
  dataset_split: test
  validate_interval_updates: 600
  required_batch_size_multiple: 8
  data_buffer_size: 10

criterion:
  _name: focal_loss
  alpha: "0.032935,0.033554,0.131136,0.103578,0.052167,0.072557,0.051789,0.111670,0.255246,0.155367"
  gamma: 0.0

optimization:
  max_update: 3000
  lr: [5e-05]
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: [0.9, 0.998]
  weight_decay: 0.005

lr_scheduler:
  _name: inverse_sqrt
  warmup_updates: 500

checkpoint:
  keep_last_epochs: 1
  best_checkpoint_metric: acc
  maximize_best_checkpoint_metric: true
  checkpoint_suffix: ''
  save_dir: ???
  checkpoint_shard_count: 1

model:
  _name: SL_topic_detection_transformer_CLS
  subsample_input: true
  dropout: 0.2
  encoder_embed_dim: 128
  encoder_ffn_embed_dim: 1024
  encoder_attention_heads: 8
  encoder_layers: 5

bpe:
  _name: sentencepiece
  sentencepiece_model: ''
